specVersion: 1.0.0
indexerHints:
  # AI discovery compares current identity with the exact published snapshot block.
  prune: never
description: >
  ERC-8004 agents on Sepolia, indexed from the registries themselves, plus the names
  issued against them. Built for ETHOnline 2026.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: IdentityRegistry
    network: sepolia
    source:
      address: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
      abi: IdentityRegistry
      startBlock: 9000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/kimlik.ts
      entities: [Agent, AgentMetadata, IdentityCheckpoint, Registry]
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
        - event: URIUpdated(indexed uint256,string,indexed address)
          handler: handleURIUpdated
        - event: MetadataSet(indexed uint256,indexed string,string,bytes)
          handler: handleMetadataSet
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
  - kind: ethereum
    name: ReputationRegistry
    network: sepolia
    source:
      address: "0x8004B663056A597Dffe9eCcC1965A193B7388713"
      abi: ReputationRegistry
      startBlock: 9000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/itibar.ts
      entities: [Agent, Feedback, AgentClient, Registry]
      abis:
        - name: ReputationRegistry
          file: ./abis/ReputationRegistry.json
      eventHandlers:
        - event: NewFeedback(indexed uint256,indexed address,uint64,int128,uint8,indexed string,string,string,string,string,bytes32)
          handler: handleNewFeedback
        - event: FeedbackRevoked(indexed uint256,indexed address,indexed uint64)
          handler: handleFeedbackRevoked
  - kind: ethereum
    name: ValidationRegistry
    network: sepolia
    source:
      address: "0x8004Cb1BF31DAf7788923b405b754f57acEB4272"
      abi: ValidationRegistry
      startBlock: 9000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/dogrulama.ts
      entities: [Agent, Validation, Registry]
      abis:
        - name: ValidationRegistry
          file: ./abis/ValidationRegistry.json
      eventHandlers:
        - event: ValidationRequest(indexed address,indexed uint256,string,indexed bytes32)
          handler: handleValidationRequest
        - event: ValidationResponse(indexed address,indexed uint256,indexed bytes32,uint8,string,bytes32,string)
          handler: handleValidationResponse
  - kind: ethereum
    name: NomenRegistrar
    network: sepolia
    source:
      address: "0x481d5fbd6f7B955D34Dbe3069B30dFFd3C15E81C"
      abi: NomenRegistrar
      startBlock: 11678998
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/isim.ts
      entities: [Agent, NomenName, Scan, Registry]
      abis:
        - name: NomenRegistrar
          file: ./abis/NomenRegistrar.json
      eventHandlers:
        - event: NameClaimed(indexed uint256,indexed address,string,uint256)
          handler: handleNameClaimed
        - event: NameRevoked(indexed uint256,string,string)
          handler: handleNameRevoked
        - event: NameRenewed(indexed uint256,uint64)
          handler: handleNameRenewed
        - event: RootPublished(indexed bytes32,string,uint64)
          handler: handleRootPublished
